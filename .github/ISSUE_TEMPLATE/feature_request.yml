name: Idea or enhancement
description: Suggest something new or a change
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and why?
      description: Say what you're trying to see or do, not only the feature. Check the open issues first in case it's already there.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mockups, other apps that do it, data sources that might help.
